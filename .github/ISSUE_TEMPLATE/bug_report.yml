name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, API keys, private domains, or sensitive screenshots.
  - type: input
    id: version
    attributes: {label: Version, placeholder: v1.0.0}
    validations: {required: true}
  - type: dropdown
    id: deployment
    attributes: {label: Deployment, options: [Docker Compose, Local development, Other]}
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes: {label: Reproduction steps}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes: {label: Sanitized logs, render: shell}

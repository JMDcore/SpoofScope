name: Feature request
description: Suggest a defensive, bounded improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Defensive monitoring problem}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed solution}
    validations: {required: true}
  - type: textarea
    id: safety
    attributes: {label: Safety, privacy, and rate-limit considerations}
    validations: {required: true}

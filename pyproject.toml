[project]
name = "spoofscope"
version = "1.0.0"
description = "Defensive domain exposure and impersonation monitoring"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.5,<3",
  "httpx>=0.27,<1", "dnspython>=2.7,<3", "beautifulsoup4>=4.12,<5",
  "python-multipart>=0.0.12,<1", "rq>=2.0,<3", "redis>=5,<6",
  "apscheduler>=3.10,<4", "tldextract>=5.1,<6", "cryptography>=50.0,<51",
  "playwright>=1.50,<2", "pillow>=12.3,<13"
]
[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "pytest-asyncio>=1.2,<2", "ruff>=0.8,<1", "bandit>=1.8,<2", "pip-audit>=2.9,<3", "testcontainers[postgres,redis]>=4.9,<5"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["spoofscope*"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E701", "E702", "B008"]
exclude = ["migrations/versions", "scripts"]
